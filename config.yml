app:
  logging:
    file: output.log
    level: INFO

wstunnel: # see https://github.com/erebe/wstunnel
  path:
    windows: wstunnel.exe # checks current folder and PATH (or .\wstunnel.exe)
    linux: ./wstunnel # or 'wstunnel' if installed on PATH
    darwin: wstunnel # Homebrew default (or ./wstunnel)

  args:
    # Required
    server: wss://www.example.com:443
    local-to-remote: udp://0.0.0.0:51820:127.0.0.1:51820?timeout_sec=0

    # Optional
    #http-upgrade-path-prefix: ...
    #http-upgrade-credentials: ...
    #tls-sni-override: wss.server.example.com

wireguard:
  path:
    windows: C:\Program Files\WireGuard\wireguard.exe
    linux: wg-quick # resolves via PATH (e.g. /usr/bin/wg-quick)
    darwin: wg-quick # resolves via PATH (Intel & Apple Silicon Homebrew)

  config:
    # Note: AllowedIPs & Endpoint are rewritten automatically.
    # If MTU is not configured, it will be automatically set to 1280 to account for wstunnel overhead.
    #path: ./wg0.conf
    str: | # Ignored if 'path' is set
      [Interface]
      PrivateKey=
      Address=
      DNS=1.1.1.1, 8.8.8.8
      MTU=1280

      [Peer]
      PublicKey=
      PresharedKey=
      AllowedIPs = 0.0.0.0/0, ::/0
      PersistentKeepalive = 20
      Endpoint = 127.0.0.1:51820

healthcheck:
  ip: # Number of tries to fetch public IP at the start of connection (stops after 5 times)
    enabled: True
    interval: 15
    restart:
      wstunnel: False
      wireguard: False

  ping: # Send a ping to wstunnel server every n secs
    enabled: True
    interval: 30
    restart:
      wstunnel: True
      wireguard: False

  state: # monitors wstunnel process state and check if wireguard tunnels are installed
    enabled: True
    interval: 5
    restart:
      wstunnel: True
      wireguard: True
