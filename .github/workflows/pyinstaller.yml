name: Pyinstaller Build
on:
  push:
    branches: [main, "dev"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            TARGET: macos_arm64
            PYI_FLAGS: ""

          - os: windows-latest
            TARGET: windows_x86_64
            PYI_FLAGS: "--uac-admin"

          - os: ubuntu-latest
            TARGET: linux_x86_64
            PYI_FLAGS: ""

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build with pyinstaller
        run: python -m PyInstaller main.py --onefile ${{ matrix.PYI_FLAGS }}

      - name: Copy config file
        run: cp config.yml dist/

      - uses: actions/upload-artifact@v4
        with:
          name: wgwst_${{ matrix.TARGET }}
          path: |
            dist/*
